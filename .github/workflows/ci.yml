name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.5"

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
            docker/airflow/dbt/pyproject.toml
            docker/airflow/dbt/uv.lock

      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps "uv==${UV_VERSION}"
          uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy strict type check
        run: uv run mypy src

      - name: Pytest with branch coverage
        run: >-
          uv run pytest
          --cov=propertyjourney360
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Audit installed Python dependencies
        run: |
          uv export --quiet --locked --all-extras --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/propertyjourney360-requirements.txt
          uv run pip-audit --strict --require-hashes \
            --requirement /tmp/propertyjourney360-requirements.txt

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  dbt-parse:
    name: dbt dependency and parse gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_BIGQUERY_PROJECT: propertyjourney360-ci
      DBT_BIGQUERY_DATASET: propertyjourney_ci
      DBT_BIGQUERY_LOCATION: australia-southeast1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-deps "uv==${UV_VERSION}"

      - name: Install locked dbt runtime
        run: uv sync --project docker/airflow/dbt --locked --no-install-project

      - name: Audit locked dbt dependencies
        run: |
          uv export --project docker/airflow/dbt --quiet --locked --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/propertyjourney360-dbt-requirements.txt
          uv run --project docker/airflow/dbt --with pip-audit==2.10.0 \
            pip-audit --strict --require-hashes \
            --requirement /tmp/propertyjourney360-dbt-requirements.txt

      - name: Resolve declared dbt packages
        run: >-
          uv run --project docker/airflow/dbt dbt deps
          --project-dir dbt --profiles-dir .github/dbt

      - name: Parse every dbt node without cloud credentials
        run: >-
          uv run --project docker/airflow/dbt dbt parse
          --project-dir dbt
          --profiles-dir .github/dbt
          --target ci
          --no-partial-parse

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Enforce Terraform formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialise providers without remote state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate

  container:
    name: Container and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build the production API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: propertyjourney360-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the Airflow and dbt operator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/airflow/Dockerfile
          push: false
          load: true
          tags: propertyjourney360-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test packaged operator and dbt CLIs
        run: |
          docker run --rm --entrypoint pj360 propertyjourney360-airflow:ci --help
          docker run --rm --entrypoint /opt/dbt-venv/bin/dbt \
            propertyjourney360-airflow:ci --version

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan Git history and working tree
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .
