    format: xlsx
    update_frequency: annual_with_revisions
    record_grain: suburb/property-type aggregate by reporting period
    geographic_coverage: Victoria, Australia
    query_or_filter: aggregate reports only; transaction-level services are excluded
    licence_name: Creative Commons Attribution 4.0 International
    licence_url: https://creativecommons.org/licenses/by/4.0/
