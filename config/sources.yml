    format: csv
    update_frequency: per_dataflow
    record_grain: selected measure by reference period and official geography
    geographic_coverage: selected Victorian SA2/geographies
    query_or_filter: pin dataflow/version; slice geography and time; never request unbounded all
    licence_name: Creative Commons Attribution 4.0 International
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution_text: Based on Australian Bureau of Statistics data.
    redistribution_status: allowed
    third_party_material_policy: verify each selected product before enabling
    repo_policy: derived_allowed
