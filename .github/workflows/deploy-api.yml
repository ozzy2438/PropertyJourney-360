name: Owner-gated API deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to build, push, plan, and deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy immutable API image
    if: >-
      ${{ inputs.confirm_deploy == 'DEPLOY' &&
          github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'australia-southeast1' }}
      TF_VAR_bigquery_location: ${{ vars.BIGQUERY_LOCATION || 'australia-southeast1' }}
      TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}
      TF_VAR_deploy_api: "true"
    steps:
      - name: Require owner and main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: "544.0.0"

      - name: Require bootstrapped Artifact Registry
        run: >-
          gcloud artifacts repositories describe
          "${{ vars.ARTIFACT_REPOSITORY }}"
          --location "${{ vars.GCP_REGION }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --quiet

      - name: Configure registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Compute image repository
        id: image
        run: >-
          echo "uri=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/propertyjourney360-api"
          >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and push commit-addressed image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Initialise protected remote state
        working-directory: infra/terraform
        run: >-
          terraform init
          -input=false
          -lockfile=readonly
          -backend-config=bucket=${{ vars.TF_STATE_BUCKET }}
          -backend-config=prefix=${{ vars.TF_STATE_PREFIX }}

      - name: Plan exact image digest
        working-directory: infra/terraform
        env:
          TF_VAR_api_image: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply owner-confirmed configuration and exact image digest
        working-directory: infra/terraform
        env:
          TF_VAR_api_image: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan
