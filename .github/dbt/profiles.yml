propertyjourney_360:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'propertyjourney360-ci') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET', 'propertyjourney_ci') }}"
      location: "{{ env_var('DBT_BIGQUERY_LOCATION', 'australia-southeast1') }}"
      threads: 2
      priority: interactive
      maximum_bytes_billed: 1000000000
      job_execution_timeout_seconds: 300
      job_retries: 1
