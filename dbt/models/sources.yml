version: 2

sources:
  - name: raw
    description: Immutable, append-only source landing tables. Private-person attributes are synthetic.
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', target.project) }}"
    schema: "{{ env_var('DBT_BIGQUERY_RAW_DATASET', 'propertyjourney_raw') }}"
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 6, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_salesforce_accounts
        columns:
          - name: id
            data_tests: [not_null]
          - name: system_modstamp
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_salesforce_contacts
        columns:
          - name: id
            data_tests: [not_null]
          - name: system_modstamp
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_salesforce_cases
        columns:
          - name: id
            data_tests: [not_null]
          - name: system_modstamp
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_legacy_customers
        columns:
          - name: customer_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_support_cases
        columns:
          - name: case_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_marketing_consents
        columns:
          - name: consent_event_id
            data_tests: [not_null]
          - name: occurred_at
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_events
        columns:
          - name: event_id
            data_tests: [not_null]
          - name: occurred_at
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_master
        config:
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 31, period: day}
        columns:
          - name: property_id
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_market
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 100, period: day}
        columns:
          - name: geography_code
            data_tests: [not_null]
          - name: period_start
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_abs_demographics
        config:
          freshness: null
        columns:
          - name: geography_code
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_rba_indicators
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 100, period: day}
        columns:
          - name: series_id
            data_tests: [not_null]
          - name: observation_date
            data_tests: [not_null]
          - name: _ingested_at
            data_tests: [not_null]
