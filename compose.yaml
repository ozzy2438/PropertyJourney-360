name: propertyjourney360

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      AIRFLOW_IMAGE: apache/airflow:3.3.1-python3.12@sha256:b01a795dfbd113bbbfdf3ee169b8f27e9a0090ccef105f1a452b3594a11ed316
      PJ360_SOURCE_TREE_SHA256: ${PJ360_SOURCE_TREE_SHA256:-UNVERIFIED}
  image: propertyjourney360-airflow:3.3.1
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:-unsafe-local-development-jwt-secret}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pj360:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PJ360_ENVIRONMENT: local
    PJ360_BATCH_INGEST_COMMAND: pj360 ingest-batch
    PJ360_EVENT_INGEST_COMMAND: pj360 ingest-events
    PJ360_INGEST_STATE_DIR: /opt/airflow/logs/pj360-state
    PJ360_PUBLIC_RAW_DIR: /opt/airflow/data/raw/public
    PJ360_PREPARED_RAW_DIR: /opt/airflow/data/raw/normalized
    PJ360_POSTGRES_DSN: postgresql://pj360:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/propertyjourney360
    PJ360_DBT_LOG_PATH: /opt/airflow/logs/dbt
    PJ360_DBT_TARGET_PATH: /opt/airflow/logs/dbt-target
    GCS_RAW_BUCKET: ${GCS_RAW_BUCKET:-}
    BIGQUERY_PROJECT: ${BIGQUERY_PROJECT:-}
    BIGQUERY_RAW_DATASET: ${BIGQUERY_RAW_DATASET:-}
    BIGQUERY_LOCATION: ${BIGQUERY_LOCATION:-australia-southeast1}
    PJ360_INGEST_SERVICE_ACCOUNT: ${PJ360_INGEST_SERVICE_ACCOUNT:-}
    PJ360_EVENT_CONSUMER_SERVICE_ACCOUNT: ${PJ360_EVENT_CONSUMER_SERVICE_ACCOUNT:-}
    SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
    SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
    SALESFORCE_LOGIN_URL: ${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
    SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-v65.0}
    DBT_BIGQUERY_PROJECT: ${DBT_BIGQUERY_PROJECT:-}
    DBT_BIGQUERY_DATASET: ${DBT_BIGQUERY_DATASET:-propertyjourney_dev}
    DBT_BIGQUERY_RAW_DATASET: ${DBT_BIGQUERY_RAW_DATASET:-}
    DBT_BIGQUERY_STAGING_DATASET: ${DBT_BIGQUERY_STAGING_DATASET:-}
    DBT_BIGQUERY_CORE_DATASET: ${DBT_BIGQUERY_CORE_DATASET:-}
    DBT_BIGQUERY_MARTS_DATASET: ${DBT_BIGQUERY_MARTS_DATASET:-}
    DBT_BIGQUERY_GOVERNANCE_DATASET: ${DBT_BIGQUERY_GOVERNANCE_DATASET:-}
    DBT_BIGQUERY_IMPERSONATE_SERVICE_ACCOUNT: ${DBT_BIGQUERY_IMPERSONATE_SERVICE_ACCOUNT:-}
    PUBSUB_EVENT_SUBSCRIPTION: ${PUBSUB_EVENT_SUBSCRIPTION:-}
    PUBSUB_DEAD_LETTER_TOPIC: ${PUBSUB_DEAD_LETTER_TOPIC:-}
    PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-}
    PYTHONPATH: /opt/propertyjourney360/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/airflow/dbt:ro
    - ./data/raw:/opt/airflow/data/raw:ro
    - airflow-logs:/opt/airflow/logs
  networks:
    - platform
  depends_on:
    postgres:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: pj360
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pj360 -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: python:3.12.14-slim-bookworm@sha256:a116514e19457bcb7af7efe9c3dd0b9b71e85b317694e7882a1c52aa15a78134
        PJ360_SOURCE_TREE_SHA256: ${PJ360_SOURCE_TREE_SHA256:-UNVERIFIED}
    image: propertyjourney360-api:local
    environment:
      PJ360_DATABASE_PATH: /app/data/propertyjourney360.db
      PJ360_ENVIRONMENT: local
      PJ360_LOG_LEVEL: ${PJ360_LOG_LEVEL:-INFO}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-pubsub-emulator:8085}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    volumes:
      - api-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - platform

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow-local-only}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:544.0.0-emulators@sha256:fd14c0f8aa18a6b2440eee967123eedab10936647a0a2a53584c5eb3ff580ba6
    profiles: ["emulators"]
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=propertyjourney360-local
    ports:
      - "127.0.0.1:${PUBSUB_EMULATOR_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8085/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform
    security_opt:
      - no-new-privileges:true

networks:
  platform:
    driver: bridge

volumes:
  airflow-logs:
  api-data:
  postgres-data:
