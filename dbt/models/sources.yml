version: 2

sources:
  - name: raw
    description: Immutable, append-only source landing tables. Private-person attributes are synthetic.
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', target.project) }}"
    schema: "{{ env_var('DBT_BIGQUERY_RAW_DATASET', 'propertyjourney_raw') }}"
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 6, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_salesforce_accounts
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_salesforce_contacts
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_salesforce_cases
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_legacy_customers
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_support_cases
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_marketing_consents
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_events
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_master
        config:
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 31, period: day}
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_property_market
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 100, period: day}
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_abs_demographics
        config:
          freshness: null
        columns:
          - name: _ingested_at
            data_tests: [not_null]
      - name: raw_rba_indicators
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 100, period: day}
        columns:
          - name: _ingested_at
            data_tests: [not_null]

  - name: governance_input
    description: Append-only operator events written outside dbt and folded into governed state.
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', target.project) }}"
    schema: "{{ env_var('DBT_BIGQUERY_GOVERNANCE_DATASET', 'propertyjourney_governance') }}"
    tables:
      - name: remediation_event
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: remediation_case_id
            data_tests: [not_null]
          - name: occurred_at
            data_tests: [not_null]
