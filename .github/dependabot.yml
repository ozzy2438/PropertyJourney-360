version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    groups:
      python-production:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /docker/airflow
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
